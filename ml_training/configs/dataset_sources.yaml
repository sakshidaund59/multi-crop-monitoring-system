    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    verified_date: "17-10-2026"
    published_date: "11 Mar 2025"
    verification_status: "VERIFIED"
    citation: "Shingne, S., Thakur, P., Jangid, A., Buchade, P., Jain, A., & Agarwal, M. (2025). Cotton Leaf Disease Dataset with Severity Levels, V3. Mendeley Data. doi: 10.17632/74jsdxtmx2.3"
