  cotton_mendeley:
    crop: cotton
    task: classification
    source_name: "Cotton Leaf Disease Dataset with Severity Levels (Mendeley Data)"
    source_url: "https://doi.org/10.17632/74jsdxtmx2.3"
    doi: "10.17632/74jsdxtmx2.3"
