    description: "5,229 real-world images of rice insect pests across 6 classes: brown-planthopper, green-leafhopper, leaf-folder, rice-bug, stem-borer, whorl-maggot."

  wheat_zenodo_jic:
    crop: wheat
    task: classification
    source_name: "Wheat disease images (small dataset) - John Innes Centre / Zenodo"
    source_url: "https://doi.org/10.5281/zenodo.7573133"
    doi: "10.5281/zenodo.7573133"
    creators: "Megan C. Long, Matthew Hartley, Richard J. Morris, James K. M. Brown (John Innes Centre)"
    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    verified_date: "17-10-2026"
    published_date: "26 Jan 2023"
    verification_status: "VERIFIED"
    citation: "Long, M. C., Hartley, M., Morris, R. J., & Brown, J. K. M. (2023). Wheat disease images (small dataset) - Long 2023 Plant Path 999 photos. Zenodo. doi: 10.5281/zenodo.7573133"
    description: "999 field and glasshouse wheat leaf photos across 5 classes: BrownRust, Healthy, Mildew, Septoria, and YellowRust."

  sugarcane_sppu:
    crop: sugarcane
    task: classification
    source_name: "Sugarcane Leaf Disease Dataset (Savitribai Phule Pune University / Mendeley Data)"
    source_url: "https://doi.org/10.17632/9424skmnrk.1"
    doi: "10.17632/9424skmnrk.1"
