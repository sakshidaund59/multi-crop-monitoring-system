services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: crop_monitoring_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crop_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-crop_monitoring_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crop_user} -d ${POSTGRES_DB:-crop_monitoring_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crop_monitoring_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crop_monitoring_backend
    restart: always
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-crop_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crop_password_dev}
      - POSTGRES_DB=${POSTGRES_DB:-crop_monitoring_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-crop_user}:${POSTGRES_PASSWORD:-crop_password_dev}@db:5432/${POSTGRES_DB:-crop_monitoring_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-crop_user}:${POSTGRES_PASSWORD:-crop_password_dev}@db:5432/${POSTGRES_DB:-crop_monitoring_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop_monitoring_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
